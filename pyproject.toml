[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fema-peltzman"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "linearmodels>=5.4",
    "scikit-learn>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "rdrobust>=1.1",
    "rpy2>=3.5",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["acquire*", "preprocessing*", "analysis*"]
